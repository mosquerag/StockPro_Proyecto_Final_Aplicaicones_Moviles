version: '3.8'

services:
  # ==============================================================================
  # BASE DE DATOS POSTGRESQL 16 PARA STOCKPRO
  # Inicializa automáticamente las migraciones Flyway (V1, V2, V3) en el primer arranque
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: stockpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpro_db
      POSTGRES_USER: stockpro_user
      POSTGRES_PASSWORD: stockpro_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpro_user -d stockpro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
