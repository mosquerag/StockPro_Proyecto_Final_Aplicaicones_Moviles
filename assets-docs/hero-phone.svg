  <g>
    <rect x="86" y="282" width="146" height="76" rx="15" fill="#FFFFFF" stroke="#E1E8E4"/>
    <rect x="100" y="295" width="26" height="26" rx="8" fill="#E6F7F0"/>
    <path d="M107 308h12M113 302v12" stroke="#087F5B" stroke-width="1.7" stroke-linecap="round"/>
    <text x="136" y="307" font-family="Segoe UI, Inter, sans-serif" font-size="8.6" fill="#6B7A74">Productos</text>
    <text x="100" y="341" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="#19211E">48</text>

    <rect x="248" y="282" width="146" height="76" rx="15" fill="#FFFFFF" stroke="#E1E8E4"/>
    <rect x="262" y="295" width="26" height="26" rx="8" fill="#E7F5FF"/>
    <path d="M268 308h14M270 303h10M272 313h6" stroke="#1C7ED6" stroke-width="1.7" stroke-linecap="round"/>
    <text x="298" y="307" font-family="Segoe UI, Inter, sans-serif" font-size="8.6" fill="#6B7A74">Ventas hoy</text>
    <text x="262" y="341" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="#19211E">12</text>

    <rect x="86" y="370" width="146" height="76" rx="15" fill="#FFFFFF" stroke="#E1E8E4"/>
    <rect x="100" y="383" width="26" height="26" rx="8" fill="#FFF3BF"/>
    <circle cx="113" cy="396" r="7" fill="none" stroke="#B07B00" stroke-width="1.6"/>
    <path d="M113 392v5l3 2" stroke="#B07B00" stroke-width="1.6" stroke-linecap="round"/>
    <text x="136" y="395" font-family="Segoe UI, Inter, sans-serif" font-size="8.6" fill="#6B7A74">Por vencer</text>
    <text x="100" y="429" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="#19211E">3</text>

    <rect x="248" y="370" width="146" height="76" rx="15" fill="#FFFFFF" stroke="#E1E8E4"/>
    <rect x="262" y="383" width="26" height="26" rx="8" fill="#FFE3E3"/>
    <path d="M268 390h14l-1 9h-12zM271 387h8" fill="none" stroke="#C92A2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="298" y="395" font-family="Segoe UI, Inter, sans-serif" font-size="8.6" fill="#6B7A74">Stock bajo</text>
    <text x="262" y="429" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="#19211E">5</text>
  </g>

  <!-- recent sales -->
  <text x="86" y="478" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#19211E">Últimas ventas</text>
  <text x="360" y="478" text-anchor="end" font-family="Segoe UI, Inter, sans-serif" font-size="9" font-weight="700" fill="#087F5B">Ver todas</text>

  <g>
    <rect x="86" y="490" width="308" height="46" rx="13" fill="#FFFFFF" stroke="#E1E8E4"/>
    <rect x="96" y="499" width="28" height="28" rx="9" fill="#E6F7F0"/>
    <path d="M104 513l4 4 8-9" fill="none" stroke="#087F5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="508" font-family="Segoe UI, Inter, sans-serif" font-size="9.4" font-weight="700" fill="#19211E">Venta #V-1042</text>
    <text x="134" y="521" font-family="Segoe UI, Inter, sans-serif" font-size="8.2" fill="#6B7A74">Efectivo · 2 ítems</text>
    <text x="382" y="513" text-anchor="end" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" font-weight="800" fill="#087F5B">$38.500</text>
  </g>
  <g>
    <rect x="86" y="544" width="308" height="46" rx="13" fill="#FFFFFF" stroke="#E1E8E4"/>
    <rect x="96" y="553" width="28" height="28" rx="9" fill="#E7F5FF"/>
    <path d="M104 567l4 4 8-9" fill="none" stroke="#1C7ED6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="562" font-family="Segoe UI, Inter, sans-serif" font-size="9.4" font-weight="700" fill="#19211E">Venta #V-1041</text>
    <text x="134" y="575" font-family="Segoe UI, Inter, sans-serif" font-size="8.2" fill="#6B7A74">Tarjeta · 1 ítem</text>
    <text x="382" y="567" text-anchor="end" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" font-weight="800" fill="#087F5B">$12.900</text>
  </g>

  <!-- bottom nav -->
  <rect x="78" y="598" width="324" height="18" rx="9" fill="#FFFFFF" stroke="#E1E8E4"/>
  <g fill="#9AA8A2">
    <path d="M108 602l4-4 4 4v7h-8z" fill="none" stroke="#9AA8A2" stroke-width="1.4"/>
    <rect x="146" y="600" width="7" height="7" rx="1.5" fill="none" stroke="#9AA8A2" stroke-width="1.4"/>
    <path d="M184 601h8M188 601v6" stroke="#9AA8A2" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M222 601v5M219 604h6" stroke="#9AA8A2" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="260" cy="603" r="3.2" fill="none" stroke="#9AA8A2" stroke-width="1.4"/>
  </g>
  <circle cx="122" cy="588" r="2.5" fill="#087F5B"/>

  <!-- floating cards -->
  <g filter="url(#card-shadow)">
    <rect x="18" y="210" width="142" height="60" rx="14" fill="#FFFFFF"/>
    <rect x="30" y="222" width="24" height="24" rx="8" fill="#FFF3BF"/>
    <path d="M42 228v7M39 232h6" stroke="#B07B00" stroke-width="1.7" stroke-linecap="round"/>
    <text x="62" y="234" font-family="Segoe UI, Inter, sans-serif" font-size="8.4" font-weight="800" fill="#19211E">Lote por vencer</text>
    <text x="62" y="246" font-family="Segoe UI, Inter, sans-serif" font-size="7.8" fill="#6B7A74">Leche Alquería · 4 días</text>
    <text x="30" y="260" font-family="Segoe UI, Inter, sans-serif" font-size="7.4" font-weight="700" fill="#087F5B">FEFO activo</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="330" y="470" width="136" height="54" rx="14" fill="#FFFFFF"/>
    <circle cx="348" cy="497" r="10" fill="#E6F7F0"/>
    <path d="M343 497l3.5 3.5 6.5-7" fill="none" stroke="#087F5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="364" y="494" font-family="Segoe UI, Inter, sans-serif" font-size="8" font-weight="800" fill="#19211E">Venta registrada</text>
    <text x="364" y="505" font-family="Segoe UI, Inter, sans-serif" font-size="7.4" fill="#6B7A74">Stock actualizado</text>
  </g>
</svg>
