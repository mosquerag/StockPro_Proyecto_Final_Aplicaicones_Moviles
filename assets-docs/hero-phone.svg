<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" role="img" aria-label="Pantalla del tablero de StockPro">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBFDFC"/>
      <stop offset="1" stop-color="#F1F7F4"/>
    </linearGradient>
    <linearGradient id="earnings" x1="60" y1="150" x2="420" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A9970"/>
      <stop offset="1" stop-color="#044D37"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2A3430"/>
      <stop offset="1" stop-color="#0E1512"/>
    </linearGradient>
    <filter id="phone-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#044D37" flood-opacity=".22"/>
    </filter>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#044D37" flood-opacity=".14"/>
    </filter>
  </defs>

  <g filter="url(#phone-shadow)">
    <rect x="48" y="18" width="384" height="624" rx="52" fill="url(#phone)"/>
    <rect x="58" y="28" width="364" height="604" rx="44" fill="#0B120F"/>
    <rect x="66" y="36" width="348" height="588" rx="38" fill="url(#screen)"/>
    <rect x="188" y="44" width="104" height="24" rx="12" fill="#0B120F"/>
  </g>

  <!-- status bar -->
  <text x="86" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" fill="#19211E">9:41</text>
  <g fill="#19211E" opacity=".8">
    <rect x="342" y="54" width="3" height="8" rx="1.5"/>
    <rect x="348" y="51" width="3" height="11" rx="1.5"/>
    <rect x="354" y="48" width="3" height="14" rx="1.5"/>
    <rect x="365" y="53" width="15" height="8" rx="2.5" fill="none" stroke="#19211E" stroke-width="1.4"/>
    <rect x="367" y="55" width="9" height="4" rx="1" fill="#19211E"/>
  </g>

  <!-- header -->
  <text x="86" y="105" font-family="Segoe UI, Inter, sans-serif" font-size="19" font-weight="800" fill="#19211E">Hola, Carlos 👋</text>
  <text x="86" y="126" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" fill="#6B7A74">Todo en orden, aquí tienes tu resumen</text>
  <circle cx="371" cy="106" r="19" fill="#E6F7F0"/>
  <circle cx="371" cy="106" r="19" fill="none" stroke="#087F5B" stroke-opacity=".18"/>
  <text x="371" y="112" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="800" fill="#087F5B">C</text>

  <!-- earnings card -->
  <g filter="url(#card-shadow)">
    <rect x="86" y="146" width="308" height="118" rx="20" fill="url(#earnings)"/>
  </g>
  <text x="106" y="173" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" fill="#D7F7EA" letter-spacing=".3">Ganancias estimadas</text>
  <text x="106" y="204" font-family="Segoe UI, Inter, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">$1.284.500</text>
  <g transform="translate(106,217)">
    <rect width="86" height="19" rx="9.5" fill="#FFFFFF" fill-opacity=".16"/>
    <path d="M8 12l4-4 3 2.5 4-5" fill="none" stroke="#B8F5DF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="25" y="13.2" font-family="Segoe UI, Inter, sans-serif" font-size="8.6" font-weight="700" fill="#D7F7EA">12% esta semana</text>
  </g>
  <g opacity=".85">
    <path d="M250 232c14 0 14-22 28-22s14 13 28 13 14-25 28-25 14 18 28 18 14-10 26-10" fill="none" stroke="#B8F5DF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="388" cy="206" r="3.4" fill="#B8F5DF"/>
  </g>

